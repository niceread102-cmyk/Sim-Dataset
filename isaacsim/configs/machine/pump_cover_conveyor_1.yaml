# The pump cover conveyor 1 (assets/machine/pump_cover_conveyor_1): URDF in the CAD frame of the pump cover cell, chain of 6 jigs (robot_sim.py moves the carriers on carriers.topic, machine/conveyor.py --machine pump_cover_conveyor_1 steps them); a map places it in scene.machines with pos_m [-2.0, 1.8, 0.0], rpy_deg [0, 0, -90].
urdf: pump_cover_conveyor_1/pump_cover_conveyor_1.urdf

collision_decomposition: {"c1_jig_[0-9]+_link": {sdf: 256}}

carriers:
  joints: [c1_jig_01_travel, c1_jig_02_travel, c1_jig_03_travel, c1_jig_04_travel, c1_jig_05_travel, c1_jig_06_travel]
  slots_m: [0.26069, 0.46069, 0.66069, 0.86069, 1.06069, 1.26069]
  #window_m: [0.0608, 1.5006]
  window_m: [0.0708, 1.2708]
  axis: [0, 1, 0]
  speed_mps: 0.2
  accel_mps2: 0.5
  topic: /pump_cover_conveyor_1/carriers

hands:
  slots: [0, 1]
  radius_m: 0.05
  z_m: [1.05, 1.2]
  origin_m: [1.7993, -0.0156, 0.0]
  topic: /pump_cover_conveyor_1/hand_plates

trigger_topic: /pump_cover_conveyor_1/step

cycle:
  timeouts_s: {machine: 60.0, start: 10.0, step: 60.0}
