# The conveyor (assets/machine/conveyopr): URDF, drives, chain of jigs, attach and the step cycle of isaacsim/machine/conveyor.py; the same in every map (a map places it in scene.machines).
urdf: conveyopr/urdf/conveyor.urdf

materials:
  - {links: ["base_link"], color: [0.62, 0.64, 0.67], metallic: 1.0, roughness: 0.40}
  - {links: ["jig_pair_.*"], color: [0.50, 0.52, 0.55], metallic: 1.0, roughness: 0.28}
  - {links: ["drive_sprocket_link"], color: [0.30, 0.31, 0.34], metallic: 1.0, roughness: 0.30}
collision: false
collision_decomposition: {}
collision_friction: {}
fixtures:
  friction: 0.08
  friction_moving: 0.5

carriers:
  joints: [jig_pair_0_joint, jig_pair_1_joint, jig_pair_2_joint, jig_pair_3_joint, jig_pair_4_joint, jig_pair_5_joint, jig_pair_6_joint, jig_pair_7_joint, jig_pair_8_joint, jig_pair_9_joint, jig_pair_10_joint, jig_pair_11_joint, jig_pair_12_joint]
  slots_m: [-0.592, -0.492, -0.392, -0.292, -0.192, -0.092, 0.008, 0.108, 0.208, 0.308, 0.408, 0.508, 0.608]
  window_m: [-0.642, 0.658]
  axis: [1, 0, 0]
  speed_mps: 0.2
  accel_mps2: 0.5
  topic: /conveyor/carriers

trigger_topic: /laser_marker/hands_done
attach:
  enabled: true
  trigger_topic: /laser_marker/hands_release
  delay_s: 0.3
  jig_links: ["jig_pair_.*"]
  jig_collision: false
  remove_box_m: [[-0.70, 0.72], [-0.30, 0.23], [0.80, 1.20]]
  base_link: base_link

cycle:
  timeouts_s: {machine: 60.0, start: 10.0, step: 60.0}
