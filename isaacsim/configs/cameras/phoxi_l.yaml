# Photoneo PhoXi 3D Scanner L. APPROXIMATE intrinsics/baseline — replace with your calibration.
defaults: [phoxi_m]
camera:
  model: PhoXi 3D Scanner L
  intrinsics: {fx: 2360.0, fy: 2360.0, cx: 1032.0, cy: 772.0}
  depth_range_m: [0.870, 2.156]
  mount:
    height_above_rim_m: 1.0
  noise:
    sigma_mm_at_1m: 0.3
    projector:
      baseline_m: [0.43, 0.0, 0.0]
