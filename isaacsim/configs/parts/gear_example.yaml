# Part definition. Swap `mesh` for your STEP/STL (STEP needs cadquery or gmsh — see README).
name: gear
mesh: ../../assets/example_gear.stl   # generated by scripts/make_example_part.py
units: mm                 # units of the mesh file (STEP is almost always mm)
recenter: true            # move the model origin to its bounding-box center (BOP models are centered)
mass_kg: 0.045
friction: 0.5
restitution: 0.05
collision: convexDecomposition   # convexDecomposition | convexHull | sdf (most accurate, slowest)
max_convex_hulls: 32
color: [0.72, 0.72, 0.75]
roughness: [0.25, 0.6]
metallic: [0.4, 0.9]

# Rotational symmetry for BOP models_info.json (pose losses need it).
# order: N (discrete, N-fold around axis) | inf (continuous) | 1 (none); flip: 180° about an axis ⟂ to `axis`
symmetry: {axis: [0, 0, 1], order: 20, flip: true}

# Orientation a part rests in when stacked in layers (applied before random yaw).
layer_rpy_deg: [0, 0, 0]

grasps:
  # Suction points sampled automatically on flat patches of the mesh (stored in the asset cache).
  suction_auto: {num: 48, seed: 0}
  # Hand-defined grasps in the part frame (after recenter), meters:
  suction: []               # - {pos: [0, 0, 0.005], normal: [0, 0, 1]}
  parallel_jaw: []          # - {pos: [0, 0, 0], rpy_deg: [0, 0, 0], width_m: 0.03}
