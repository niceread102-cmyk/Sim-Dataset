# The pump cover cell: the side plate cell (the M20 on its stand, the pallets, the laser marker and the conveyor) with other crates and another part.
#   lab robot_sim.py map:=PUMP_COVER_MAP [robot:=<robot>]          ros2 launch robot.launch.py map:=PUMP_COVER_MAP [robot:=<robot>] [sequence:=true]
# A map of its own: everything of the scene is in this file (the machines themselves are configs/machine/<name>.yaml). World = the Isaac Sim world (m).

scene:                        # robot_sim.py: what stands around the robot; the launch, the sequence and the tools read the robot, its pose and the machines from here too
  robot: m20_35_18d_mhzl2_20d  # the robot of this map (robot:=<name> on the command line wins)
  robot_pose: [-0.0635, -0.0035, 1.1, 0, 0, 180]   # where the robot base stands in this map [x, y, z (m), roll, pitch, yaw (deg)]: on the RobotStand (see SIDE_PLATE_MAP.yaml)
  sequence: pump_cover        # the sequence of this map (configs/sequence/<name>.yaml) that `sequence:=true` of the launch runs
  map: SIDE_PLATE_MAP         # an environment made in the Isaac Sim GUI: a USD of assets/map/ (name or path); null = none
  map_collision:              # the collision of parts of the map: convexHull | convexDecomposition | meshSimplification | none (triangle mesh) | off (no collider)
    - {prim: SIDE_PLATE_MAP/Pallet, collision: convexDecomposition, options: {max_hulls: 64, voxel_resolution: 1000000, error_percentage: 5.0}}   # the pallets (one mesh of 315 k faces): the decomposition keeps them apart
  map_edits:                  # parts of the map stretched in height: every vertex of the meshes below `prim` above above_z_m moves up by dz_m
    - {prim: SIDE_PLATE_MAP/RobotStand, above_z_m: 0.5, dz_m: 0.1}   # the stand of the robot: its four columns 100 mm longer, the top plate (and the robot on it) at 1.1 m
  pallets:                    # crates of parts stacked on the pallets of the map: remove this section = none (binsim/pallets.py)
    seed: random              # random = a new random arrangement on every start (printed), a number = the same one every time
    items:                    # the pallets that get crates: pos_m = centre of the deck at deck top height, yaw_deg
      - {pos_m: [0.6582, 0.8168, 0.12], yaw_deg: 45}
      - {pos_m: [0.6582, -0.8168, 0.12], yaw_deg: 45}
    crate:                    # the blue crates of the side plates are replaced by the box of configs/object/bin.yaml (myeonghwa_box_520x365x200mm.stl)
      config: bin             # its USD is made from the STL like the one of the bin
      size_m: [0.520, 0.365, 0.200]  # outer x y z (the long side is x)
      inner_size_m: [0.500, 0.345]   # usable floor x y
      floor_z_m: 0.0114              # top of the floor above the bottom of the box
      collision: meshSimplification  # collision of the crate mesh: meshSimplification | convexHull | convexDecomposition | none (triangle mesh) | "off" (no collider)
      gap_m: 0.002                   # 3 x 0.365 + 2 gaps = 1.099 m: a layer fills the 1.1 m pallet
    part: pump_cover_light    # configs/object/pump_cover_light.yaml: pump_cover.stl (494 k triangles) cut to 33 k, the same size 191 x 109 x 14 mm
    parts_per_crate: 6        # 6 lying flat cover 73 % of the floor; more are stacked on each other
    layers: 6                 # 6 x 0.2 m: the stack is 1.32 m high (with the pallet)
    grids: [[2, 3]]           # crates per layer along the pallet's x y
    grid_mode: pallet         # layer = a random grid for every layer | pallet = one for each pallet | alternate = the grids in turn
    dynamic_layers: 1         # parts of the top N layers are free bodies (gravity, the robot picks them); the ones below are fixed
  machines:                   # configs/machine/<name>.yaml + where it stands in this map (see SIDE_PLATE_MAP.yaml)
    - name: laser_marker
      pos_m: [-1.2223, -0.6579, 0.0]
      rpy_deg: [0, 0, -90]
      replaces: SIDE_PLATE_MAP/LaserMarker
    - name: conveyor
      pos_m: [-1.8399, 0.7521, -0.081]
      rpy_deg: [0, 0, -90]
      replaces: SIDE_PLATE_MAP/Conveyor
  objects: []                 # single rigid parts, configs/object/<part>.yaml; pos_m = part center (world, m)
