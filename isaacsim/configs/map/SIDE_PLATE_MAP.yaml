# Map of the side plate cell: the M20 on its stand, two pallets of crates with side plates, the laser marker and the conveyor (robot pose, map USD, pallets, machines, cameras).
# lab robot_sim.py map:=SIDE_PLATE_MAP   |   ros2 launch robot.launch.py map:=SIDE_PLATE_MAP [sequence:=true]
