# Config of the dataset generator (generate_isaacsim.py, generate_supervisor.py), not a map of robot_sim.py: camera / bin presets, parts, loading, physics, outputs.
# Any leaf can be overridden on the command line (key=value).
defaults: [../camera/phoxi_1952x1460, ../object/bin]

camera:
  image_mode: rgb
  texture_brightness: [0.45, 1.4]
  random_height: true
  near_share: 0.5
  min_distance_m: 0.5
  aim_at_parts: true
  aim_max_outside: 0.15

sim:
  backend: isaacsim
  experience: ~/IsaacSim/_build/linux-aarch64/release/apps/isaacsim.exp.base.kit
  headless: false
  device: cuda:0
  physics_dt: 0.005
  seed: 0
  quat_order: auto
  render_during_settle: null
  viewport_updates: auto
  kit_args: "--/rtx/reservedDescriptors=900000 --/rtx/descriptorSets=360000"

run:
  output_dir: ~/output
  num_envs: 8
  env_spacing_m: 4.0
  num_scenes: 250
  views_per_scene: 100
  num_parts: 4
  scene_offset: 0
  shard_id: 0
  save_overview_every: null
  save_viz_every: 1
  save_viz_views: 1
  writer_threads: 3
  log_every_s: 5.0

assets:
  cache_dir: ../../assets_cache

bin:
  pos_m: [0.0, 0.0, 0.0]
  rpy_deg: [0, 0, 0]
  friction: 0.5

floor:
  color: [0.048, 0.032, 0.015]

parts:
  - config: ../object/support_input_shaft.yaml
    count: [280, 300]

loading:
  mode: random
  mixed_layers_prob: 0.3
  wall_margin_m: 0.03
  pick:
    end_left_pct: [5, 10]
    end_left: [3, 60]
    jitter: 0.3
  partial_fill:
    prob: 0.0
    min_fraction: 0.05
  random:
    drop_height_m: [0.01, 0.06]
    orientation: uniform
  layers:
    num_layers: [1, 3]
    spacing_m: 0.004
    pos_jitter_m: 0.004
    yaw_jitter_deg: 15
    flip_prob: 0.0
    fill_ratio: [0.7, 1.0]
    overflow: drop
  shake:
    impulses: 2
    lin_vel_mps: 0.15
    ang_vel_rps: 2.0
    bin_oscillation:
      amp_m: 0.0
      freq_hz: 3.0
      duration_s: 0.6
  vibrate:
    every_views: 10
    amp_m: 0.005
    freq_hz: 8.0
    duration_s: 0.3
    settle_s: 0.3
    spread:
      speed_mps: 0.5
      lift: 0.25
      wall_fade_m: 0.05
      pulses: 2
  settle:
    min_steps: 60
    max_steps: 600
    lin_vel_thresh: 0.005
    ang_vel_thresh: 0.05
    hold_steps: 10
    escape_margin_m: 0.0
    rim_clearance_m: 0.02

randomization:
  lights:
    dome_intensity: [70, 330]
    key_intensity: [2000, 12000]
    key_height_m: [1.2, 2.0]
    key_offset_m: 0.8
    projector_intensity: [500000, 2000000]
    projector_radius_m: 0.03
    state_jitter: 0.2
    state_key_move_m: 0.1
  part_materials: true
  part_color: fixed
  color_jitter: 0.12
  roughness_jitter: 0.15
  metallic_jitter: 0.15
  bin_materials: false

gripper:
  type: suction
  usd: null
  attach_link: ee_link
  attach_pos_m: [0.0, 0.0, 0.0]
  attach_rpy_deg: [0, 0, 0]
  suction:
    cup_radius_m: 0.006
    max_planarity_err_m: 0.0012
    max_normal_dev_deg: 12
  primitives:
    - {type: cylinder, radius_m: 0.008, z_m: [-0.030, -0.002]}
    - {type: cylinder, radius_m: 0.016, z_m: [-0.180, -0.030]}

grasps:
  enabled: false
  min_visib: 0.6
  max_approach_angle_deg: 45
  approach_clearance_m: 0.05
  point_samples: 1500
  max_grasps_per_part: 64

outputs:
  bop: true
  coco: true
  pointcloud_ply: false
  viz: true
  depth_scale: 0.1
  full_masks: false
  mask_format: instance
  depth_vis_style: phoxi
  folders:
    rgb: true
    depth: true
    depth_vis: true
    depth_relief: true
    mask_visib_inst: true
    poses: true
    grasps: false
  verify_first_scene: true
  skip_invisible: true
