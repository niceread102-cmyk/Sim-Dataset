# Map Orange: 3 x 3 citrus crates x 6 layers on the floor in front of the R-2000iC/125L, to measure distances and reach.   lab robot_sim.py map:=Orange
scene:
  robot: r2000ic_125l
  pallets:
    seed: 0
    items:
      - {pos_m: [2.0, 0.0, 0.0], yaw_deg: 90}
    crate:
      usd: ../../../assets/object/usd/citrus_crate_550x360x300.usd
      size_m: [0.598, 0.360, 0.300]
      inner_size_m: [0.500, 0.310]
      floor_z_m: 0.02
      collision: "off"
      gap_m: 0.10
    parts_per_crate: 0
    layers: 6
    grids: [[3, 3]]
    dynamic_layers: 1
