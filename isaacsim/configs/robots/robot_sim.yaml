# lab robot_sim.py [--name m20_35_18d] [--gripper none]    (URDF: ../control/<name>/urdf/<name>.urdf)
name: m20_35_18d
gripper: jegg2510n_straight_300mm # gripper_assets/urdf/<gripper>.urdf, root link (flange) joined to the robot's; none = no gripper
gripper_topic: /gripper/command   # std_msgs/Float64: 0 = closed, 1 = open (in between: partly open)
gripper_material: {metallic: 1.0, roughness: 0.3}   # gripper look (converted URDF colours are plastic-like:
                                  # metallic 0, roughness 0.5); lower roughness = shinier; null = as converted
pos_m: [0.0, 0.0, 0.0]            # robot base in the world (m)
rpy_deg: [0, 0, 0]
joint_pos: {}                     # start pose (rad), e.g. {J2: 0.3, J3: -0.2}; joints not listed: 0
stiffness: 20000                  # joint drives, N*m/deg (prismatic: N/m) (lite6 script: 1600 / 80). Higher = less sag
damping: 1000                     # higher = less swinging, slower settling
speed: 0.3                        # max joint speed = speed x URDF velocity limit
controller: /m20_traj_controller  # <controller>/joint_trajectory, <controller>/follow_joint_trajectory
objects: []                       # single rigid parts, configs/parts/<part>.yaml; pos_m = part center (world, m), e.g.
                                  # - {part: side_plate_bp, pos_m: [1.2, 0.0, 0.02], rpy_deg: [0, 0, 0]}
bin:                              # picking test: the dataset's bin + a pile, both in world (= robot base) coordinates
  dataset_config: default.yaml    # configs/<this>: its bin (parts/bin.yaml, blue 520 x 365 x 200 mm) and loading settings
  pos_m: [1.0, 0.0, 0.0]          # bin bottom centre (world, m)
  rpy_deg: [0, 0, 0]
  pile: {part: side_plate_bp, count: 100, seed: 0}   # dropped in like the dataset (random mode, uniform orientation)
basket:                           # where the part is released: an open box (floor + 4 walls, kinematic), world (= robot base) coordinates
  pos_m: [0.3, 0.5, 0.0]          # basket bottom centre (m). control/robot_sequence.yaml (basket.sim_config) reads pos_m and
                                  # wall_thickness_m from here: its place pose must be above the basket and the gripper goes
                                  # down to the floor of this basket before it lets go
  rpy_deg: [0, 0, 0]
  size_m: [0.40, 0.30, 0.15]      # outer size [x, y, z]
  wall_thickness_m: 0.01          # floor and walls
  color: [0.80, 0.50, 0.20]       # orange-brown
