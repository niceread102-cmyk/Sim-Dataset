# lab robot_sim.py robot:=m20_35_18d [--gripper none]    (URDF: ../../../assets/robot/<name>/urdf/<name>.urdf). Only the robot is here:
# the scene (bin, pile, basket, objects) is configs/map/map.yaml, the robot to start is scene.robot of configs/map/map.yaml.
name: m20_35_18d
gripper: jegg2510n_original_fingers # ../../../assets/grippper/<gripper>/urdf/<gripper>.urdf, root link (flange) joined to the robot's; none = no gripper
gripper_topic: /gripper/command   # std_msgs/Float64: 0 = closed, 1 = open (in between: partly open)
gripper_material: {metallic: 1.0, roughness: 0.3}   # gripper look (converted URDF colours are plastic-like:
                                  # metallic 0, roughness 0.5); lower roughness = shinier; null = as converted
pos_m: [-0.0635, -0.0035, 1.0]   # robot base in the world (m): J1 axis at the centre of the 300 x 300 bolt square on the RobotStand of the map (assets/map/SIDE_PLATE_MAP.usd), z = top of the stand
rpy_deg: [0, 0, 0]
joint_pos: {}                     # start pose (rad), e.g. {J2: 0.3, J3: -0.2}; joints not listed: 0
stiffness: 20000                  # joint drives, N*m/deg (prismatic: N/m) (lite6 script: 1600 / 80). Higher = less sag
damping: 1000                     # higher = less swinging, slower settling
speed: 0.3                        # max joint speed = speed x URDF velocity limit
physics_hz: 60                    # physics steps per simulated second (Isaac Sim default 60, dataset generator 200). Higher = parts and
collision_decomposition: ["gripper_.*"]   # link-name regexes: the colliders of these links (the gripper) are convexDecomposition instead of the converter's convexHull, so the fingers keep their exact shape (done on the stage, no cache to delete)
                                  # the gripper fingers sink into each other less, but every step costs time (the sim loop is already slow)
wrist_camera:                     # a camera on the robot (the colour lens of the PhoXi, link phoxi_camera of the URDF, OpenCV frame): publish std_msgs/Empty on /wrist_camera/capture
  link: phoxi_camera              #    (ros2 topic pub --once /wrist_camera/capture std_msgs/msg/Empty "{}") and one RGB + depth frame is written to output_dir (the camera/ layout of
  output_dir: ~/project/gdrnpp_bin_6DOF_estimation/camera  #    gdrnpp's camera_convert_data.py). The camera of the models (PrimaryCamera): 1236 x 1032, fx ~1412; no depth noise
  resolution: [1236, 1032]
  fx: 1412.0
  fy: 1412.0
  lens:                           # the lens of the training-data camera (configs/cameras/phoxi_1952x1460.yaml): barrel distortion, the "convex" look (corners pulled in ~17 %
    distortion: {k1: -0.3594}     #    at this wider field of view). The images are the distorted ones like the raw captures of the real PhoXi; camera_convert_data.py --to-bop
                                  #    undistorts them with the undistort_map.npy that is saved next to them. Remove `lens:` = ideal pinhole images (then --to-bop needs --keep-distortion)
  depth_scale: 0.1                # mm per depth PNG value (0.1 = 0.1 mm steps, like the dataset)
  depth_range_m: [0.458, 1.118]   # PhoXi M scanning range: nothing outside it (0 = no depth)
  warmup_frames: 8                # app updates before the frame is read (the first frames of a new render product are empty)
controller: /m20_35_18d_traj_controller  # <controller>/joint_trajectory, <controller>/follow_joint_trajectory
