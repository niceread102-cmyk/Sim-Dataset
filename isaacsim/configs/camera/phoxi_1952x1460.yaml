# Camera of the real colour photos of the blue side-plate bin (1952 x 1460): lens and intrinsics; the rest comes from phoxi_m.yaml (defaults).
defaults: [phoxi_m]
camera:
  model: PhoXi colour photo 1952x1460
  resolution: [1952, 1460]
  render_scale: 0.5
  intrinsics: {fx: 2364.0, fy: 2364.0, cx: 975.5, cy: 729.5}
  lens:
    enabled: true
    cx: 975.5
    cy: 729.5
    distortion: {k1: -0.3594}
