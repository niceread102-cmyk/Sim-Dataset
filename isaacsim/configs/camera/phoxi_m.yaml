# Photoneo PhoXi 3D Scanner M (structured light): intrinsics (approximate, from the datasheet), depth range, noise model and mount for the dataset generator.
camera:
  model: PhoXi 3D Scanner M
  resolution: [2064, 1544]
  render_scale: 0.5
  intrinsics: {fx: 2500.0, fy: 2500.0, cx: 1032.0, cy: 772.0}
  lens: {}
  depth_range_m: [0.458, 1.118]
  image_mode: gray
  texture_normalize: 99
  texture_brightness: [0.6, 1.3]
  texture_noise:
    blur_px: [0.0, 0.7]
    gauss_std: [0.5, 3.0]
  mount:
    height_above_rim_m: 0.60
    offset_m: [0.0, 0.0, 0.0]
    look_at_m: [0.0, 0.0, 0.0]
    image_up_world: [0, 1, 0]
  pose_jitter:
    pos_m: 0.03
    look_at_m: 0.02
    roll_deg: 4.0
  render_subframes: 2
  warmup_frames: 30
  noise:
    enabled: true
    sigma_mm_at_1m: [0.4, 0.8]
    quantize_mm: 0.05
    edge_blur_px: 0.0
    edge_shift_px: 0
    edge_ragged: {}
    edge_grad_mm: 6.0
    edge_strength: 0.6
    edge_width_px: 3
    edge_dropout_run_px: 5.0
    edge_dropout_prob: [0.6, 0.95]
    edge_dilate_px: 0
    max_incidence_deg: [72, 80]
    max_incidence_parts_deg: [58, 68]
    random_dropout: 0.0
    outliers:
      fraction: [0.0, 0.0003]
      mm: [3, 20]
      far:
        count: [1, 4]
        radius_px: [0.5, 3.0]
        mm: [300, 650]
    specular:
      angle_deg: [1.5, 3.5]
      prob: [0.3, 0.8]
      dilate_px: 1
      min_px: 12
      smooth_px: 2.0
    holes:
      count: [0, 6]
      radius_px: [3, 8]
    cavity:
      window_px: [15, 31]
      depth_mm: [8, 15]
    projector:
      enabled: true
      baseline_m: [-0.24, 0.0, 0.0]
      tolerance_mm: 3.0
      downsample: 1
      slope_px: 2.0
