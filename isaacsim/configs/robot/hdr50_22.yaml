# lab robot_sim.py robot:=hdr50_22    (URDF: ../../../assets/robot/hdr50_22/urdf/hdr50_22.urdf, MoveIt: ros2 launch robot.launch.py robot:=hdr50_22)
# Generated by isaacsim/make_robot_config.py. Only the robot is here, the same in every map: what stands around it is the map (configs/map/<map>.yaml, map:=<map>).
name: hdr50_22
gripper: none
pos_m: [0.0, 0.0, 0.0]            # mount of the robot base (m) = 0 for every robot: where it stands in a map is scene.robot_pose of the map
rpy_deg: [0, 0, 0]
joint_pos: {j2: 1.5708, j3: -0.2618, j5: -1.3090}
                                  # start pose (rad) = the ready pose = ik_seed_deg of bringup/hdr50_22/config/ik_node.yaml
stiffness: 20000                  # joint drives, N*m/deg (prismatic: N/m). Higher = less sag. The force limit is the URDF effort
damping: 1000                     # higher = less swinging, slower settling
speed: 0.3                        # max joint speed = speed x URDF velocity limit
velocity_scaling: 0.15            # MoveIt (ik_node.py, robot_sequence.py): share of the joint velocity limits the motions use (1.0 = full)
acceleration_scaling: 0.05        # MoveIt: share of the acceleration limits (bringup/<robot>/config/joint_limits.yaml)
joint_limits_deg: {}              # narrower position range per joint than the URDF (deg), e.g. {J1: [-90, 90]}: MoveIt plans and solves the IK inside it (the start pose has to be inside too)
physics_hz: 60                    # physics steps per simulated second
controller: /hdr50_22_traj_controller  # <controller>/joint_trajectory, <controller>/follow_joint_trajectory (bringup/hdr50_22/config/moveit_controllers.yaml)
