# lab robot_sim.py robot:=ur5e    (URDF: ../../../assets/robot/ur5e/urdf/ur5e.urdf, MoveIt: ros2 launch robot.launch.py robot:=ur5e)
# Only the robot is here, the same in every map: what stands around it is the map (configs/map/<map>.yaml, map:=<map>).
name: ur5e
gripper: none                     # no gripper: the target of ee_6d is tool0 (the flange)
gripper_topic: /gripper/command   # only used with a gripper
gripper_material: null
pos_m: [0.0, 0.0, 0.0]            # mount of the robot base (m) = 0 for every robot: where it stands in a map is scene.robot_pose of the map
rpy_deg: [0, 0, 0]
joint_pos: {shoulder_lift_joint: -1.5708, elbow_joint: 1.5708, wrist_1_joint: -1.5708, wrist_2_joint: -1.5708}
                                  # start pose (rad): ready pose, elbow up, tool pointing down (= SEED_Q of bringup/ur5e ik node)
stiffness: 1600                   # joint drives, N*m/deg (the lite6 script's value, an arm of the same size; m20: 20000). Higher = less sag
damping: 80                       # higher = less swinging, slower settling (m20: 1000)
speed: 0.3                        # max joint speed = speed x URDF velocity limit
velocity_scaling: 0.15            # MoveIt (ik_node.py, robot_sequence.py): share of the joint velocity limits the motions use (1.0 = full)
acceleration_scaling: 0.05        # MoveIt: share of the acceleration limits (bringup/<robot>/config/joint_limits.yaml)
joint_limits_deg: {}              # narrower position range per joint than the URDF (deg), e.g. {J1: [-90, 90]}: MoveIt plans and solves the IK inside it (the start pose has to be inside too)
physics_hz: 60                    # physics steps per simulated second (Isaac Sim default 60)
controller: /ur5e_traj_controller # <controller>/joint_trajectory, <controller>/follow_joint_trajectory (bringup/ur5e/config/moveit_controllers.yaml)
