# r2000ic_165f: FANUC R-2000iC/165F: top level = URDF, gripper, start pose in rad, limits for MoveIt / ik_node.py / robot_sequence.py (the same on the real robot), `sim:` = drives, speeds and colliders of isaacsim/robot_sim.py only, the same in every map.
# lab robot_sim.py robot:=r2000ic_165f   |   ros2 launch robot.launch.py robot:=r2000ic_165f
name: r2000ic_165f
gripper: none
gripper_topic: /gripper/command
pos_m: [0.0, 0.0, 0.0]
rpy_deg: [0, 0, 0]
joint_pos: {}
velocity_scaling: 0.15
acceleration_scaling: 0.05
joint_limits_deg: {}
controller: /r2000ic_165f_traj_controller
sim:
  gripper_material: null
  stiffness: 20000
  damping: 1000
  speed: 0.3
  physics_hz: 60
