# m20_35_18d: FANUC M-20iD/35 with the JEGG2510N gripper in isaacsim/robot_sim.py and MoveIt (URDF, gripper, start pose in rad, drives, speeds, limits), the same in every map.
# lab robot_sim.py robot:=m20_35_18d   |   ros2 launch robot.launch.py robot:=m20_35_18d
name: m20_35_18d
gripper: jegg2510n_original_fingers
gripper_topic: /gripper/command
gripper_material: {metallic: 1.0, roughness: 0.3}
pos_m: [0.0, 0.0, 0.0]
rpy_deg: [0, 0, 0]
joint_pos: {}
stiffness: 20000
damping: 1000
speed: 0.3
velocity_scaling: 0.15
acceleration_scaling: 0.05
joint_limits_deg: {}
physics_hz: 60
collision_decomposition: ["gripper_.*"]
wrist_camera:
  link: phoxi_camera
  output_dir: ~/project/gdrnpp_bin_6DOF_estimation/camera
  resolution: [1236, 1032]
  fx: 1412.0
  fy: 1412.0
  lens:
    distortion: {k1: -0.3594}
  depth_scale: 0.1
  depth_range_m: [0.458, 1.118]
  warmup_frames: 8
controller: /m20_35_18d_traj_controller
