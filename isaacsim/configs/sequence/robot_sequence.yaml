# Parameters of control/robot_sequence.py and control/ik_node.py that are the same for every robot and task: MoveIt services, approach, straight lines, IK, tolerances, retries, topics.
target: tcp

poses:
  home: ready
  place: home
  release: null
  place_height: null
  place_offset: null

approach:
  distance: 0.2

line:
  service: /compute_cartesian_path
  action: /execute_trajectory
  max_step: 0.005
  revolute_jump_threshold: 0.3
  min_fraction: 0.999
  ik_step: 0.1
  ik_angle_step: 15

ik:
  service: /compute_ik
  timeout: 1.0
  retry_timeout: 0.3
  avoid_collisions: true

startup:
  poll: 1.0
  retries: 3

tolerance:
  joint: 0.001
  waypoint_position: 0.02

motion:
  planning_time: 5.0
  planning_attempts: 1
  retries: 2
  recover_home: true
  timeout: 120.0

gripper:
  topic: /gripper/command
  open: 1.0
  close: 0.0

topics:
  target_pose: /target_pose
  move_action: /move_action
  joint_states: /joint_states
  place_variant: /place_variant
  target_part_pose: /target_part_pose
  machine_ready: /laser_marker/ready
  transfer_done: /transfer_done
  sequence_done: /sequence_done
  part_turned_over: /part_turned_over
