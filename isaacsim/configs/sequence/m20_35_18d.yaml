# robot_sequence.py for m20_35_18d: what differs from robot_sequence.yaml (poses of the M20 setup, TCP [x, y, z, roll, pitch, yaw] in base_link).
poses:
  home: [1.0, 0.0, 1.0, 180, 0, 0]    # initialization pose = home pose, in front of the robot and high (the TCP of the ready pose is further out)
  place: [0.3, 0.5, 1.0, 180, 0, 0]   # above the basket (x y inside the basket walls)
