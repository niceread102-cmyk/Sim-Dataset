# Sequence of the side plate map (SIDE_PLATE_MAP), the same for every robot: place poses by the state of the part, approach and trajectory.
target: tcp
poses:
  place:
    standard:  [-0.512, -0.658, 1.070, 180, 0, 0]
    turn_over: [-0.312, -0.658, 0.995, 180, 0, 0]
  place_offset: 0.3

transfer:
  align_yaw: true
  pick:  [-0.512, -0.658, 1.0625, 180, 0, 0]
  place: [-0.972, -0.658, 1.0070, 180, 0, 0]

waits:
  close_gripper_start: 0.0
  approach: 0.0
  insert: 0.0
  open_gripper: 0.0
  rise: 0.0
  home: 0.0
  place: 0.0
  lower: 0.0
  release: 1.0
  lift: 0.0
  return_home: 0.0
  transfer:
    release: 1.0

trajectory:
  place: line

robots:
  m20_35_18d_mhzl2_20d:
    poses:
      home: [0.061, -0.749, 1.538, 180, 0, 45]
