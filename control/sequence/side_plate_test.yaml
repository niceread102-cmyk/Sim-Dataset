  scan: {offset_m: [-0.1531, -0.0072], height_m: 0.4006, rpy_deg: [180, 0, 45]}
  size: [0.4516, 0.3042]
  yaw: 45
  margin: 0.02
  floor_z: 1.0849
  rank_weights: {flat: 3.0, height: 1.0, centre: 0.5}
  layers: 6
  layer_pitch_m: 0.190
  per_pallet: 6
  clear_topic: /crate_clear
  next_topic: /crate_next
  ready_topic: /crate_ready
  active_topic: /crate_active
  parts_request_topic: /crate_parts_request
  parts_topic: /crate_parts
  parts_remove_topic: /crate_parts_remove
  #remove_placed: true
  remove_placed: false
  remove_radius_m: 0.08
  settle_s: 1.0

