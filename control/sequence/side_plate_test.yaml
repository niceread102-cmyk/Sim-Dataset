# Sequence of the side plate map (SIDE_PLATE_MAP) with m20_35_18d_mhzl2_20d: control/auto_control.py empties the crates one by one (the poses of the parts come from robot_sim.py), each plate is put at its place pose (standard | turn_over) when the laser marker says that seat is free (/laser_marker/state); a plate on the standard seat (/laser_marker/ready) is taken to the belt of the laser marker (transfer:) between the crate picks.
# Poses are TCP poses in the world frame of the map, tool down = roll 180.   ros2 launch robot.launch.py sequence:=side_plate_test
