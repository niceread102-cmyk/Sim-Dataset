    - {centre: [0.4736, 0.6322], home: [0.3205, 0.6250, 1.4855, 180, 0, 45]}
    - {centre: [0.7332, 0.3727], home: [0.5801, 0.3655, 1.4855, 180, 0, 45]}
    - {centre: [0.5832, 1.2609], home: [0.4301, 1.2537, 1.4855, 180, 0, 45]}
