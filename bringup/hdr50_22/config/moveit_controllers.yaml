# hdr50_22: the controller MoveIt executes on, /hdr50_22_traj_controller/follow_joint_trajectory (served by isaacsim/robot_sim.py). Generated by isaacsim/make_robot_config.py.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - hdr50_22_traj_controller

  hdr50_22_traj_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
