# Parameters of control/ik_node.py for hdr50_22 (generated by isaacsim/make_robot_config.py).
base_frame: world   # frame of /target_pose and the IK: the Isaac Sim world (robot.launch.py puts where the robot stands in the map, scene.robot_pose, into MoveIt's URDF)
group_name: arm                   # config/hdr50_22.srdf
ee_link: tool0                    # z axis = tool direction, so rpy (180, 0, 0) = tool pointing down
arm_joints: [j1, j2, j3, j4, j5, j6]
tcp_offset: [0, 0, 0]            # m, TCP (gripper tip) in the ee_link frame

# IK seed (deg), in arm_joints order: the ready pose (= start pose of the sim).
# ik_node.py solves from the current joint angles: this pose is only its start before /joint_states arrives (and the start of the
# first IK of control/robot_sequence.py).
ik_seed_deg: [0, 90, -15, 0, -75, 0]

# Speed (velocity_scaling, acceleration_scaling) and narrower joint limits (joint_limits_deg) are the robot's: isaacsim/configs/robot/hdr50_22.yaml

# Joints that can turn more than a full turn (position range wider than 360 deg in the URDF) and that range (deg). The IK can
# return the angle of such a joint a full turn off (q +- 360) and the arm would spin once round to reach it: ik_node sends the
# equivalent angle nearest to the current one (inside this range and joint_limits_deg of the robot yaml). Joints not listed are sent as solved.
wrap_joints_deg:
  j1: [-180.023339, 180.023339]
  j4: [-359.989383, 359.989383]
  j6: [-359.989383, 359.989383]
