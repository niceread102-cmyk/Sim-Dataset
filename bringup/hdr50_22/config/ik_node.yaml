# Parameters of control/ik_node.py for hdr50_22 (generated by isaacsim/make_robot_config.py).
base_frame: base_link
group_name: arm                   # config/hdr50_22.srdf
ee_link: tool0                    # z axis = tool direction, so rpy (180, 0, 0) = tool pointing down
arm_joints: [j1, j2, j3, j4, j5, j6]
tcp_offset: [0, 0, 0]            # m, TCP (gripper tip) in the ee_link frame

# IK seed (deg), in arm_joints order: the ready pose (= start pose of the sim). The same side of the IK solutions is always picked.
ik_seed_deg: [0, 90, -15, 0, -75, 0]

# Speed: fraction of the limits MoveIt uses (velocity from the URDF, acceleration from config/joint_limits.yaml)
velocity_scaling: 0.15
acceleration_scaling: 0.05

# Optional: narrower range per joint (deg) than the URDF; an IK solution outside it is refused.
joint_limits_deg: {}
