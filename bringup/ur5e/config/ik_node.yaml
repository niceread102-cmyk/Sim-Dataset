# Parameters of control/ik_node.py for the UR5e (python3 control/ik_node.py --config bringup/ur5e/config/ik_node.yaml).
base_frame: base_link
group_name: ur_manipulator        # config/ur5e.srdf
ee_link: tool0                    # z axis = tool direction, so rpy (180, 0, 0) = tool pointing down
arm_joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
tcp_offset: [0.0, 0.0, 0.0]       # m, TCP in the ee_link frame (no gripper: tool0 itself)

# IK seed (deg), in arm_joints order: ready pose, elbow up, tool pointing down. The same side of the IK solutions is always picked.
ik_seed_deg: [0, -90, 90, -90, -90, 0]

# Speed: fraction of the limits MoveIt uses (velocity from the URDF, acceleration from config/joint_limits.yaml)
velocity_scaling: 0.15
acceleration_scaling: 0.05

# Optional: narrower range per joint (deg) than the URDF; an IK solution outside it is refused. Example:
# joint_limits_deg: {shoulder_pan_joint: [-170, 170], elbow_joint: [-150, 150]}
joint_limits_deg: {}

# Optional (defaults in control/ik_node.py): planning_time 5.0 s, planning_attempts 10, goal_tolerance 0.001 rad,
# ik_timeout 2.0 s, busy_timeout 60.0 s
