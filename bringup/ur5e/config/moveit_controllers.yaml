# ur5e: the controller MoveIt executes on, /ur5e_traj_controller/follow_joint_trajectory (served by isaacsim/robot_sim.py). Generated by isaacsim/make_robot_config.py.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - ur5e_traj_controller

  ur5e_traj_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
