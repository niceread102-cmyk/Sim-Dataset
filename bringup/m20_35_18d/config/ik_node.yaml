# Parameters of control/ik_node.py for the FANUC M-20iD/35 (python3 control/ik_node.py --config bringup/m20_35_18d/config/ik_node.yaml).
base_frame: world   # frame of /target_pose and the IK: the Isaac Sim world (robot.launch.py puts where the robot stands in the map, scene.robot_pose, into MoveIt's URDF)
group_name: arm                   # config/m20_35_18d.srdf
ee_link: fanuc_flange             # the flange front-face frame (z axis = tool direction), so rpy (180, 0, 0) = tool pointing down
arm_joints: [J1, J2, J3, J4, J5, J6]
# TCP (gripper finger tip) in the fanuc_flange frame: gripper_tcp of the JEGG-2510N original fingers
# (assets/jegg2510n_original_fingers/urdf/jegg2510n_original_fingers.urdf) = adapter 8 mm + motor rear to finger tip 461.316 mm = 469.316 mm.
# Without a gripper use [0, 0, 0].
tcp_offset: [0.0, 0.0, 0.469316]

# IK seed (deg), in arm_joints order: ready pose, elbow up, tool pointing down (J5 = -90).
# ik_node.py solves from the current joint angles: this pose is only its start before /joint_states arrives (and the start of the
# first IK of control/robot_sequence.py).
ik_seed_deg: [0, 0, 0, 0, -90, 0]

# Speed (velocity_scaling, acceleration_scaling) and narrower joint limits (joint_limits_deg) are the robot's: isaacsim/configs/robot/m20_35_18d.yaml

# Joints that can turn more than a full turn (position range wider than 360 deg in the URDF) and that range (deg). The IK can
# return the angle of such a joint a full turn off (q +- 360) and the arm would spin once round to reach it: ik_node sends the
# equivalent angle nearest to the current one (inside this range and joint_limits_deg of the robot yaml). Joints not listed are sent as solved.
wrap_joints_deg:
  J4: [-200, 200]
  J6: [-450, 450]
