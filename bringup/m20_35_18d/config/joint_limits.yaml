# The velocity values of m20_35_18d_urdf_macro.xacro (= matching the FANUC datasheet Speed entry:
# 180/180/200/350/350/400 deg/s) are used as they are. The acceleration spec is not in the official material, so the
# value that MoveIt's time-optimal trajectory generation (TOTG, AddTimeOptimalParameterization) requires is set to
# 2x the velocity (reaches max speed within 0.5 s, a conservative estimate commonly used for industrial robots).
# With has_acceleration_limits: false, TOTG itself throws an "undefined" error and nothing can be executed at all.
joint_limits:
  J1:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 6.283185307179586
  J2:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 6.283185307179586
  J3:
    has_velocity_limits: true
    max_velocity: 3.490658503988659
    has_acceleration_limits: true
    max_acceleration: 6.981317007977318
  J4:
    has_velocity_limits: true
    max_velocity: 6.1086523819801535
    has_acceleration_limits: true
    max_acceleration: 12.217304763960307
  J5:
    has_velocity_limits: true
    max_velocity: 6.1086523819801535
    has_acceleration_limits: true
    max_acceleration: 12.217304763960307
  J6:
    has_velocity_limits: true
    max_velocity: 6.981317007977318
    has_acceleration_limits: true
    max_acceleration: 13.962634015954636
