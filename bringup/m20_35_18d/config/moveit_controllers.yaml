# Uses the FollowJointTrajectory action server provided by isaacsim/robot_sim.py as the controller as it is.
# The action name is assembled as "<controller name>/<action_ns>", so here it is
# /m20_35_18d_traj_controller/follow_joint_trajectory — it must match the controller: value of isaacsim/configs/robot/m20_35_18d.yaml.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# MoveIt only moves the robot: its built-in execution time limit (TIMED_OUT) is switched off. Waiting and time limits are
# handled by control/robot_sequence.py (motion.timeout).
trajectory_execution:
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - m20_35_18d_traj_controller

  m20_35_18d_traj_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
