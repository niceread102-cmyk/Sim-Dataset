# r2000ic_125l: written from the URDF by isaacsim/make_robot_config.py at every run: change the URDF (or --accel-factor), not this file.
# Velocities are the URDF velocity limits; MoveIt's time-optimal trajectory generation needs an acceleration:
# 2 x the velocity. With has_acceleration_limits: false it throws an "undefined" error and nothing can be executed.
# Position and effort limits are the URDF's (MoveIt reads position from there; the sim drive force limit is the effort), listed
# here to read: position deg (m), velocity rad/s (m/s), effort N*m (N):
#   J1: position ±185, velocity 2.26893, effort 10000
#   J2: position -60 ~ 76, velocity 2.00713, effort 20000
#   J3: position -79 ~ 180, velocity 2.18166, effort 20000
#   J4: position ±360, velocity 3.14159, effort 4000
#   J5: position ±125, velocity 3.14159, effort 4000
#   J6: position ±360, velocity 4.53786, effort 3000
joint_limits:
  J1:
    has_velocity_limits: true
    max_velocity: 2.2689280275926285
    has_acceleration_limits: true
    max_acceleration: 4.537856055185257
  J2:
    has_velocity_limits: true
    max_velocity: 2.007128639793479
    has_acceleration_limits: true
    max_acceleration: 4.014257279586958
  J3:
    has_velocity_limits: true
    max_velocity: 2.181661564992912
    has_acceleration_limits: true
    max_acceleration: 4.363323129985824
  J4:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 6.283185307179586
  J5:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 6.283185307179586
  J6:
    has_velocity_limits: true
    max_velocity: 4.537856055185257
    has_acceleration_limits: true
    max_acceleration: 9.075712110370514
