# r2000ic_125l: generated by isaacsim/make_robot_config.py. The FollowJointTrajectory action server is provided by isaacsim/robot_sim.py
# (controller: of configs/robot/r2000ic_125l.yaml). The action name is "<controller name>/<action_ns>", here
# /r2000ic_125l_traj_controller/follow_joint_trajectory.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# MoveIt only moves the robot: its built-in execution time limit (TIMED_OUT) is switched off.
trajectory_execution:
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - r2000ic_125l_traj_controller

  r2000ic_125l_traj_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
