# r2000ic_125l: the controller MoveIt executes on, /r2000ic_125l_traj_controller/follow_joint_trajectory (served by isaacsim/robot_sim.py). Generated by isaacsim/make_robot_config.py.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - r2000ic_125l_traj_controller

  r2000ic_125l_traj_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
