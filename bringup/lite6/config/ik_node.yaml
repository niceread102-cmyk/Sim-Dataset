# Parameters of control/ik_node.py for the UFactory Lite6 with its gripper (python3 control/ik_node.py --config bringup/lite6/config/ik_node.yaml).
base_frame: world   # frame of /target_pose and the IK: the Isaac Sim world (robot.launch.py puts pos_m / rpy_deg of configs/robots/<name>.yaml into MoveIt's URDF)
group_name: lite6                 # config/lite6.srdf (the group ends at link_tcp)
ee_link: link_tcp                 # between the gripper fingers (0.0836 m from link_eef); z axis = tool direction, rpy (180, 0, 0) = tool pointing down
arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6]
tcp_offset: [0.0, 0.0, 0.0]       # m, TCP in the ee_link frame (link_tcp is the TCP itself)

# IK seed (deg), in arm_joints order: the `init` pose of the lite6 setup (config/robots/lite6.yaml of my_lite6_control).
# ik_node.py solves from the current joint angles: this pose is only its start before /joint_states arrives (and the start of the
# first IK of control/robot_sequence.py).
ik_seed_deg: [0, 0, 90, 0, 90, 0]

# Speed: fraction of the limits MoveIt uses (velocity from the URDF, acceleration from config/joint_limits.yaml)
velocity_scaling: 0.15
acceleration_scaling: 0.05

# Optional: narrower range per joint (deg) than the URDF; an IK solution outside it is refused. Example:
# joint_limits_deg: {joint2: [-130, 130], joint5: [-110, 110]}
joint_limits_deg: {}

# Joints that can turn more than a full turn (position range wider than 360 deg in the URDF) and that range (deg). The IK can
# return the angle of such a joint a full turn off (q +- 360) and the arm would spin once round to reach it: ik_node sends the
# equivalent angle nearest to the current one (inside this range and joint_limits_deg). Joints not listed are sent as solved.
wrap_joints_deg:
  joint1: [-360, 360]
  joint4: [-360, 360]
  joint6: [-360, 360]
