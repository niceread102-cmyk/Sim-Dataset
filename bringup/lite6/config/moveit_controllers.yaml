# Uses the FollowJointTrajectory action server provided by isaacsim/robot_sim.py (or run_isaacsim.py; CONTROLLERS there).
# The action name is assembled as "<controller name>/<action_ns>", so here it is /lite6_traj_controller/follow_joint_trajectory.
# The gripper is not planned by MoveIt: the sim gripper is driven by /gripper/command (std_msgs/Float64).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# MoveIt only moves the robot: its built-in execution time limit (TIMED_OUT) is switched off.
trajectory_execution:
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - lite6_traj_controller

  lite6_traj_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
