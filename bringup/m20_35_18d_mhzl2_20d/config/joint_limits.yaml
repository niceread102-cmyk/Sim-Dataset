# m20_35_18d_mhzl2_20d: written from the URDF by isaacsim/make_robot_config.py at every run: change the URDF (or --accel-factor), not this file.
# Velocities are the URDF velocity limits; MoveIt's time-optimal trajectory generation needs an acceleration:
# 2 x the velocity. With has_acceleration_limits: false it throws an "undefined" error and nothing can be executed.
# Position and effort limits are the URDF's (MoveIt reads position from there; the sim drive force limit is the effort), listed
# here to read: position deg (m), velocity rad/s (m/s), effort N*m (N):
#   J1: position ±170, velocity 3.14159, effort 7000
#   J2: position -100 ~ 160, velocity 3.14159, effort 9000
#   J3: position -90 ~ 220, velocity 3.49066, effort 4000
#   J4: position ±200, velocity 6.10865, effort 600
#   J5: position ±180, velocity 6.10865, effort 500
#   J6: position ±450, velocity 6.98132, effort 300
joint_limits:
  J1:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 6.283185307179586
  J2:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 6.283185307179586
  J3:
    has_velocity_limits: true
    max_velocity: 3.490658503988659
    has_acceleration_limits: true
    max_acceleration: 6.981317007977318
  J4:
    has_velocity_limits: true
    max_velocity: 6.1086523819801535
    has_acceleration_limits: true
    max_acceleration: 12.217304763960307
  J5:
    has_velocity_limits: true
    max_velocity: 6.1086523819801535
    has_acceleration_limits: true
    max_acceleration: 12.217304763960307
  J6:
    has_velocity_limits: true
    max_velocity: 6.981317007977318
    has_acceleration_limits: true
    max_acceleration: 13.962634015954636
