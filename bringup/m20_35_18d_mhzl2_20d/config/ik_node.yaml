# Parameters of control/ik_node.py for m20_35_18d_mhzl2_20d (generated by isaacsim/make_robot_config.py).
base_frame: world   # frame of /target_pose and the IK: the Isaac Sim world (robot.launch.py puts pos_m / rpy_deg of configs/robots/m20_35_18d_mhzl2_20d.yaml into MoveIt's URDF)
group_name: arm                   # config/m20_35_18d_mhzl2_20d.srdf
ee_link: fanuc_flange                    # z axis = tool direction, so rpy (180, 0, 0) = tool pointing down
arm_joints: [J1, J2, J3, J4, J5, J6]
tcp_offset: [0, 0, 0.45]            # m, TCP (gripper tip) in the ee_link frame

# IK seed (deg), in arm_joints order: the ready pose (= start pose of the sim).
# ik_node.py solves from the current joint angles: this pose is only its start before /joint_states arrives (and the start of the
# first IK of control/robot_sequence.py).
ik_seed_deg: [165, 15, 0, 0, -75.0002, 0]

# Speed: fraction of the limits MoveIt uses (velocity from the URDF, acceleration from config/joint_limits.yaml)
velocity_scaling: 0.15
acceleration_scaling: 0.05

# Optional: narrower range per joint (deg) than the URDF; an IK solution outside it is refused.
joint_limits_deg: {}

# Joints that can turn more than a full turn (position range wider than 360 deg in the URDF) and that range (deg). The IK can
# return the angle of such a joint a full turn off (q +- 360) and the arm would spin once round to reach it: ik_node sends the
# equivalent angle nearest to the current one (inside this range and joint_limits_deg). Joints not listed are sent as solved.
wrap_joints_deg:
  J4: [-200, 200]
  J6: [-450, 450]
