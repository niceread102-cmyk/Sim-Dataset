# Side plate (cast, before machining). Reference: /home/v/IsaacSim/assets/myeonghwa/SIDE_PLATE.usd
# (same mm->m scale, mass, convex decomposition with 32 hulls).
name: side_plate
mesh: ../../assets/SIDE-PLATE.stl   # 54 x 54 x 9.6 mm, watertight
units: mm
recenter: true            # move the model origin to its bounding-box center (BOP models are centered)
mass_kg: 0.047            # SIDE_PLATE.usd physics:mass; 13.3 cm^3 x steel 7.85 g/cm^3 = 0.104 kg
friction: 0.5             # SIDE_PLATE.usd has no physics material -> PhysX defaults (friction 0.5, restitution 0)
restitution: 0.0
collision: convexDecomposition   # convexDecomposition | convexHull | sdf (most accurate, slowest)
max_convex_hulls: 32      # same as SIDE_PLATE.usd
# Optional PhysX settings written into part.usd (unset = PhysX defaults). Tested with generate.py (Isaac Lab
# backend): contact_offset_m 0.002 / max_depenetration_velocity 0.5 / 16 iterations made parts escape MORE.
# physx: {contact_offset_m: 0.002, rest_offset_m: 0.0, max_depenetration_velocity: 0.5, max_linear_velocity: 5.0,
#         solver_position_iterations: 16, solver_velocity_iterations: 1, enable_ccd: false}
# OmniPBR values copied from SIDE_PLATE.usd (Base Color, Color Tint, Roughness Amount, Metallic Amount)
color: [0.28571427, 0.2857114, 0.2857114]
color_tint: [0.66023165, 0.66022503, 0.66022503]
roughness: 0.5
metallic: 1.0

# Measured from the mesh: 180 deg about Z maps the part onto itself (0.17 mm, = sampling noise);
# 90/120/60 deg do not (~0.7 mm), and top/bottom differ (flip 1.3 mm).
symmetry: {axis: [0, 0, 1], order: 2, flip: false}

# Rests flat (thin axis = Z) when stacked in layers.
layer_rpy_deg: [0, 0, 0]

grasps:
  # Suction points sampled automatically on flat patches of the mesh (stored in the asset cache).
  suction_auto: {num: 48, seed: 0}
  # Hand-defined grasps in the part frame (after recenter), meters:
  suction: []               # - {pos: [0, 0, 0.005], normal: [0, 0, 1]}
  parallel_jaw: []          # - {pos: [0, 0, 0], rpy_deg: [0, 0, 0], width_m: 0.03}
