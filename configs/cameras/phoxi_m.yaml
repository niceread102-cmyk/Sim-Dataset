# Photoneo PhoXi 3D Scanner M (structured light).
# Intrinsics / baseline are APPROXIMATE (derived from the datasheet scan area at the sweet spot).
# Replace `intrinsics` with the calibrated K from PhoXi Control for sim-to-real accuracy.
camera:
  model: PhoXi 3D Scanner M
  resolution: [2064, 1544]      # full-res (3.2 MP mode) — intrinsics below are for this size
  render_scale: 0.5             # render at 1032x772 (K is scaled to match); 1.0 = full res, slower
  intrinsics: {fx: 2500.0, fy: 2500.0, cx: 1032.0, cy: 772.0}
  depth_range_m: [0.458, 1.118] # scanning range; depth outside is invalid (0), like the real sensor
  image_mode: gray              # gray (PhoXi texture) | rgb
  texture_normalize: 99         # exposure per image: gain so the 99th percentile -> 235 (black stays black).
                                # [lo, hi] = stretch those percentiles to 0..255 (hard contrast); null = raw render.
                                # Real PhoXi textures are raw floats: convert them with the same
                                # binsim.noise.normalize_texture(img, 99) before inference
  texture_brightness: [0.6, 1.3]  # then x this factor, drawn per image: <1 darker, >1 brighter (null = off).
                                  # normalize alone makes every image equally bright
  texture_noise:                # after texture_normalize, strength drawn per image (values or [lo, hi])
    blur_px: [0.0, 0.7]         # gaussian blur sigma in pixels (lens, slight defocus)
    gauss_std: [0.5, 3.0]       # sensor noise in gray levels
  mount:
    height_above_rim_m: 0.60    # camera height above the bin rim (~0.85 m to the floor: whole 600x400 bin in view)
    offset_m: [0.0, 0.0, 0.0]   # xy offset from the bin center (bin frame)
    look_at_m: [0.0, 0.0, 0.0]  # look-at point relative to bin floor center
    image_up_world: [0, 1, 0]   # world direction that appears "up" in the image (bin long axis X -> image width)
  pose_jitter:                  # per view, around the mount pose
    pos_m: 0.03
    look_at_m: 0.02
    roll_deg: 4.0
  render_subframes: 2           # extra RTX frames after moving the camera (removes ghosting)
  noise:                        # numbers may be [lo, hi] ranges: drawn per image
    enabled: true               # tuned against real PAJ-042 scans of the side-plate bin (2026-09-29): sharp outlines,
                                # clean faces, holes = projector shadows + gaps between parts + steep flanks
    sigma_mm_at_1m: [0.4, 0.8]  # axial noise, scales with depth^2 (structured-light triangulation)
    quantize_mm: 0.05
    edge_blur_px: 0.0           # depth low-pass (gaussian sigma, px at 1032x772): smeared, rounded outlines (0 = off;
                                # the real scans have pixel-sharp outlines)
    edge_shift_px: 0            # outlines grow (+) / shrink (-) by up to this many px, drawn per image (0 = off)
    edge_ragged: {}             # irregular outlines: {band_px, blob_px, amount} ({} = off; not seen in real scans)
    edge_grad_mm: 6.0           # depth jump (per pixel) treated as an edge (part outline) ...
    edge_strength: 0.6          # ... how dark the outlines come out, 0..1 (or [lo, hi] per image): 0 = no gap at the
                                # outlines (faint), 1 = every outline pixel without depth + a gap edge_width_px wide
                                # on the far side (thick black rings). 0.6 = PAJ-042 mm scans. null = the two lines below
    edge_width_px: 3            # outline gap width at edge_strength 1 (strength 0.5 -> ~2 px)
    edge_dropout_run_px: 5.0    # outline pixels drop out in pieces of about this length (0 = pixel by pixel = dotted)
    edge_dropout_prob: [0.6, 0.95]  # only with edge_strength: null - share of outline pixels without depth
    edge_dilate_px: 0               # only with edge_strength: null - outline widened by this many px
    max_incidence_deg: [72, 80] # steeper surfaces return no depth (bin, floor)
    max_incidence_parts_deg: [58, 68]  # same for the metal parts (their steep flanks are empty in the real scans)
    random_dropout: 0.0         # salt-and-pepper holes everywhere (real scans: none)
    outliers:                   # isolated wrong depth values (decoding errors): this fraction of valid pixels ...
      fraction: [0.0, 0.0003]
      mm: [3, 20]               # ... is moved by a random amount of this size (gaussian sigma, mm)
      far:                      # small patches inside holes decoded far behind the scene (PAJ-042 scans: 2-4 per
        count: [1, 4]           # image, 1-100 px at full res, ~300-650 mm too far = 0.98-1.24 m). They are the max
        radius_px: [0.5, 3.0]   # of a min-max normalised view (sample viewer Output/depth: that is why the parts
        mm: [300, 650]          # there are mid gray, not white). {} = off
    specular:                  # metal parts only: where the surface mirrors the projector into the camera the
      angle_deg: [1.5, 3.5]     # sensor saturates -> no depth (normal within this angle of the mirror direction)
      prob: [0.3, 0.8]          # each highlight patch is lost whole with this probability ...
      dilate_px: 1
      min_px: 12                # ... if it has at least this many pixels
      smooth_px: 2.0            # normals averaged over this radius first (per mesh facet = mottled black faces)
    holes:                      # metal parts only: patchy missing regions (dark / glossy spots, failed decoding)
      count: [0, 6]             # discs per image ...
      radius_px: [3, 8]         # ... of this radius (at the rendered 1032x772)
    cavity:                     # narrow deep gaps between parts get no depth ({} = off):
      window_px: [15, 31]       # gaps narrower than this ...
      depth_mm: [8, 15]         # ... and deeper than this below the surfaces around them
    projector:                  # projector shadow: points the projector can't see get no depth
      enabled: true
      baseline_m: [-0.24, 0.0, 0.0] # projector position in the camera (OpenCV) frame, distance approx. PAJ-042 scans:
                                    # shadows lie right of the parts -> projector left of the camera (-x)
      tolerance_mm: 3.0
      downsample: 1             # projector z-buffer resolution (2 = half: coarser, striped shadows on walls)
      slope_px: 2.0             # tolerance + this many projector pixels' worth of the surface slope (no stripes on walls)
